<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
       */
      background-image: linear-gradient(to bottom right in oklab, oklch(.129 .042 264.695) 0%, oklch(.208 .042
265.755) 50%, oklch(.129 .042 264.695) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }
    
    .title {
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.9);
      margin-bottom: 40px;
    }
    
    .loading {
      width: 250px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    
    .loading-bar {
      width: 30%;
      height: 100%;
      background: white;
      border-radius: 10px;
      animation: loading 1.5s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }
    
    .version {
      position: absolute;
      bottom: 30px;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    
    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(433%);
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="./favicon.ico" alt="Logo">
  </div>
  <div class="title">岳中科技</div>
  <div class="subtitle">监控屏</div>
  <div class="loading">
    <div class="loading-bar"></div>
  </div>
  <!-- <div class="version">v1.0.0</div> -->
</body>
</html>
